<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f8f3f7" />
    <meta
      name="description"
      content="Graphos / trilha 03: troque de lugar os cavalos brancos e pretos e entenda por que o mínimo é o que é."
    />
    <title>Troca de cavalos - Graphos</title>
    <link rel="icon" href="assets/logo.png" type="image/png" />
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/trilha.css" />
    <link rel="stylesheet" href="css/jornada.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>

  <body class="trail" data-page="troca">
    <div id="chrome"></div>
    <main class="wrap" id="conteudo">
      <header class="shead">
        <div>
          <h1>Troca de cavalos</h1>
          <p>
            Os brancos devem ocupar as casas iniciais dos pretos, e os pretos as
            dos brancos, sem capturas. Qual é o menor número de movimentos?
          </p>
        </div>
      </header>
      <div class="work">
        <div class="viz one">
          <section class="card">
            <div class="ph">
              <h2>Tabuleiro</h2>
              <span class="mut" id="bcap"></span>
            </div>
            <div class="cv">
              <svg
                id="bsvg"
                class="v"
                role="group"
                aria-label="Tabuleiro da troca de cavalos"
              ></svg>
              <div class="zb">
                <button type="button" data-zoom="in" aria-label="Aproximar">
                  +</button
                ><button type="button" data-zoom="out" aria-label="Afastar">
                  −</button
                ><button
                  type="button"
                  data-zoom="fit"
                  aria-label="Ajustar à tela"
                >
                  ⤢
                </button>
              </div>
            </div>
            <div class="tools">
              <div class="seg" id="view" aria-label="Representação">
                <button type="button" data-view="board" aria-pressed="true">
                  Tabuleiro</button
                ><button type="button" data-view="graph" aria-pressed="false">
                  Grafo
                </button>
              </div>
              <span class="sp"></span>
              <button type="button" class="sm" id="undo">Desfazer</button>
              <button type="button" class="sm" id="restart">Reiniciar</button>
            </div>
            <dl class="kv kv3" id="score"></dl>
            <p class="fb info" id="fb" role="status" aria-live="polite"></p>
          </section>
        </div>
        <aside class="panel" aria-label="Etapas da troca">
          <div class="seg" id="steps" aria-label="Etapas">
            <button type="button" data-step="1" aria-pressed="true">
              1 Regras</button
            ><button type="button" data-step="2" aria-pressed="false">
              2 Investigar</button
            ><button type="button" data-step="3" aria-pressed="false">
              3 Matemática</button
            ><button type="button" data-step="4" aria-pressed="false">
              4 Irregulares
            </button>
          </div>
          <div id="pstep"></div>
        </aside>
      </div>
      <nav class="pager" id="pager" aria-label="Navegar entre módulos"></nav>
    </main>
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/main.js"></script>
    <script src="js/jornada.js"></script>
    <script src="js/exemplos.js"></script>
    <script src="js/regras.js"></script>
    <script src="js/estrutura.js"></script>
    <script src="js/grafo.js"></script>
    <script src="js/analise.js"></script>
    <script src="js/solucao.js"></script>
    <script src="js/jogo.js"></script>
    <script src="js/fase.js"></script>
    <script src="js/troca.js"></script>
    <script src="js/motion.js"></script>
  </body>
</html>
